[package]
name = "ignite-lsp-types"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generates the Ignite module of LSP message types from the LSP metaModel.json; never linked into compiled programs."
autotests = false

[lib]
test = false
bench = false

[[bin]]
name = "ignite-lsp-types"
path = "src/main.rs"
test = false
bench = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.10"

[[test]]
name = "main"
path = "tests/main.rs"
